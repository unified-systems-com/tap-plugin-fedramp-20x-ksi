name: Refresh KSI Catalog

on:
  schedule:
    # Nightly at 09:00 UTC. Adjust freely; upstream-side caching in GitHub
    # makes this cheap, and diff-only emission means most runs are no-ops.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  # Minimum scope. The workflow creates a branch, commits wave files, and
  # opens a PR. It does not merge, read secrets beyond the token, or modify
  # settings.
  contents: write
  pull-requests: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Advance upstream submodule pointer
        run: |
          git submodule update --remote skills/refresh-ksi-catalog/upstream
          # Record whether the pointer actually moved so later steps can short-circuit.
          if git diff --quiet skills/refresh-ksi-catalog/upstream; then
            echo "pointer_moved=false" >> "$GITHUB_ENV"
          else
            echo "pointer_moved=true" >> "$GITHUB_ENV"
          fi

      - name: Run refresh tool
        id: refresh
        run: |
          set +e
          python3 skills/refresh-ksi-catalog/refresh.py --output-format json > refresh-result.json
          echo "exit_code=$?" >> "$GITHUB_ENV"
          set -e
          # Always surface the result file so subsequent steps can consume it.
          cat refresh-result.json

      - name: Halt on tool misconfiguration
        if: env.exit_code == '2'
        run: |
          echo "::error::refresh.py exited 2 (tool misconfiguration); see above"
          exit 1

      - name: Halt on block-severity flag
        if: env.exit_code == '1'
        run: |
          echo "::error::refresh.py blocked by safety flag(s); see refresh-result.json"
          python3 -c "import json; d=json.load(open('refresh-result.json')); [print(f'  {f[\"severity\"]}: {f[\"code\"]} — {f[\"detail\"]}') for f in d['flags']]"
          exit 1

      - name: Exit early if no-op
        if: env.exit_code == '0'
        run: |
          NOOP=$(python3 -c "import json; print(json.load(open('refresh-result.json')).get('no_op', False))")
          if [ "$NOOP" = "True" ]; then
            echo "Upstream unchanged; no wave to emit. Exiting cleanly."
            echo "wave_produced=false" >> "$GITHUB_ENV"
          else
            echo "wave_produced=true" >> "$GITHUB_ENV"
          fi

      - name: Configure git author
        if: env.wave_produced == 'true'
        run: |
          git config user.name "refresh-ksi-catalog"
          git config user.email "refresh-ksi-catalog@users.noreply.github.com"

      - name: Stage wave files and submodule pointer
        if: env.wave_produced == 'true'
        run: |
          git add skills/refresh-ksi-catalog/upstream
          git add skills/refresh-ksi-catalog/state/source-manifest.json
          git add grift/

      - name: Compose branch name and PR body
        if: env.wave_produced == 'true'
        id: pr_meta
        run: |
          WAVE_FILENAME=$(python3 -c "import json; print(json.load(open('refresh-result.json'))['wave_filename'])")
          SHA=$(python3 -c "import json; print(json.load(open('refresh-result.json'))['source_commit'][:7])")
          BRANCH="refresh/ksi-catalog-$(date -u +%Y-%m-%d)-$SHA"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Flag-summary text for the PR body.
          python3 << 'PY' > pr-body.md
          import json
          r = json.load(open("refresh-result.json"))
          print(f"## FedRAMP 20x KSI catalog refresh")
          print()
          print(f"- Upstream commit: `{r.get('source_commit', '')[:7]}`")
          print(f"- Prior commit: `{(r.get('prior_commit') or 'none')[:7]}`")
          print(f"- Wave file: `{r.get('wave_filename', '')}`")
          print()
          print(f"### Changes")
          print(f"- Themes added: {r.get('themes_added', 0)}")
          print(f"- Indicators added: {r.get('indicators_added', 0)}")
          print(f"- Indicators modified: {r.get('indicators_modified', 0)}")
          print(f"- Indicators deprecated: {r.get('indicators_deprecated', 0)}")
          print(f"- Catalog size after: {r.get('catalog_size_after', 0)}")
          print()
          print(f"### Safety flags ({len(r.get('flags', []))} total)")
          for f in r.get("flags", []):
              print(f"- **{f['severity']}** `{f['code']}` — {f['detail']}")
          if r.get("review_required"):
              print()
              print("> **Review required.** Merge only after adding the `safety-review-ok` label.")
          PY

      - name: Create branch and commit
        if: env.wave_produced == 'true'
        run: |
          BRANCH="${{ steps.pr_meta.outputs.branch }}"
          git checkout -b "$BRANCH"
          git commit -m "refresh: KSI catalog $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"

      - name: Open PR
        if: env.wave_produced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.pr_meta.outputs.branch }}"
          REVIEW_REQUIRED=$(python3 -c "import json; print(json.load(open('refresh-result.json'))['review_required'])")
          LABELS="catalog-refresh"
          if [ "$REVIEW_REQUIRED" = "True" ]; then
            LABELS="$LABELS,needs-safety-review"
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "refresh: KSI catalog $(date -u +%Y-%m-%d)" \
            --body-file pr-body.md \
            --label "$LABELS" || \
          (echo "Note: label creation may have failed if labels don't exist yet. PR was still opened."; true)
